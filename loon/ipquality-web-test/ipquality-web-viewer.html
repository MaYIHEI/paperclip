<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>节点 IP 质量检测</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 16px max(34px, env(safe-area-inset-bottom));
      background: #f2f2f7;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    .shell { width: min(100%, 720px); margin: 0 auto; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin: 4px 2px 18px; }
    h1 { margin: 0; font-size: 22px; line-height: 1.25; }
    .subtitle, .muted { color: #6e6e73; font-size: 12px; line-height: 1.5; }
    .version { flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; background: #e4f1ff; color: #0874dc; font-size: 11px; }
    .panel { overflow: hidden; margin-bottom: 14px; border-radius: 20px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.045); }
    .session { padding: 15px 16px; }
    .session strong { display: block; margin-top: 4px; font-size: 16px; overflow-wrap: anywhere; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 3px 9px; }
    .section-title h2 { margin: 0; font-size: 16px; }
    .option { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 58px; padding: 10px 15px; border-bottom: 1px solid #ececf0; }
    .option:last-child { border-bottom: 0; }
    .option-copy { min-width: 0; }
    .option-name { display: block; font-size: 14px; font-weight: 600; }
    .option-desc { display: block; margin-top: 2px; color: #8e8e93; font-size: 11px; line-height: 1.35; }
    .switch { position: relative; flex: 0 0 auto; width: 48px; height: 29px; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .track { position: absolute; inset: 0; border-radius: 999px; background: #d1d1d6; transition: background .18s ease; }
    .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.24); transition: transform .18s ease; }
    .switch input:checked + .track { background: #30d158; }
    .switch input:checked + .track::after { transform: translateX(19px); }
    .switch input:focus-visible + .track { outline: 3px solid rgba(10,132,255,.35); outline-offset: 2px; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 14px 0 4px; }
    .primary, .secondary { min-height: 46px; border: 0; border-radius: 15px; padding: 0 17px; font-weight: 600; cursor: pointer; }
    .primary { background: #0a84ff; color: #fff; }
    .secondary { background: #e5e5ea; color: #1c1c1e; }
    button:disabled { cursor: default; opacity: .55; }
    .progress { margin: 9px 3px 16px; color: #6e6e73; font-size: 12px; }
    .result { margin-bottom: 12px; border-radius: 20px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.045); }
    .result summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; padding: 13px 15px; cursor: pointer; list-style: none; }
    .result summary::-webkit-details-marker { display: none; }
    .result-title { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #c7c7cc; }
    .result[data-state="running"] .dot { background: #ff9f0a; }
    .result[data-state="success"] .dot { background: #30d158; }
    .result[data-state="error"] .dot { background: #ff453a; }
    .result-status { color: #8e8e93; font-size: 11px; text-align: right; }
    .result[data-state="success"] .result-status { color: #16824f; }
    .result[data-state="error"] .result-status { color: #d72f26; }
    .result-content { padding: 0 10px 12px; border-top: 1px solid #ececf0; }
    .report-frame { display: block; width: 100%; min-height: 220px; border: 0; background: transparent; }
    .error { margin: 0; padding: 15px 6px 5px; color: #d72f26; font-size: 13px; line-height: 1.55; }
    .empty { padding: 22px 16px; color: #8e8e93; text-align: center; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      :root, body { background: #000; color: #f2f2f7; }
      .panel, .result { background: #1c1c1e; box-shadow: none; }
      .version { background: #102b45; color: #64b5ff; }
      .subtitle, .muted, .progress { color: #a1a1a6; }
      .option, .result-content { border-color: #303034; }
      .option-desc, .result-status { color: #98989f; }
      .secondary { background: #2c2c2e; color: #f2f2f7; }
      .track { background: #48484a; }
      .result[data-state="success"] .result-status { color: #32d583; }
      .result[data-state="error"] .result-status, .error { color: #ff6961; }
    }
    @media (max-width: 430px) {
      body { padding-left: 12px; padding-right: 12px; }
      .actions { grid-template-columns: 1fr; }
      .secondary { order: 2; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>节点 IP 质量检测</h1>
        <div class="subtitle">模块化网页测试 · 按需加载</div>
      </div>
      <span class="version">Rewrite v2</span>
    </header>

    <section class="panel session">
      <span class="muted">当前检测会话</span>
      <strong id="session-label">正在读取…</strong>
    </section>

    <div class="section-title">
      <h2>选择检测项目</h2>
      <span class="muted" id="selected-count">0 项已开启</span>
    </div>
    <section class="panel" id="module-options"></section>

    <div class="actions">
      <button type="button" class="primary" id="run-button">开始检测已选项目</button>
      <button type="button" class="secondary" id="clear-button">清空结果</button>
    </div>
    <div class="progress" id="progress">准备就绪</div>

    <div class="section-title">
      <h2>检测结果</h2>
      <span class="muted">每项可独立展开</span>
    </div>
    <section id="results"><div class="panel empty">选择项目后开始检测</div></section>
  </main>

  <script>
    (function () {
      var MODULES = [
        { id: "basic", title: "基础信息", desc: "出口 IP、位置、ASN 与组织", checked: true },
        { id: "types", title: "IP 类型属性", desc: "各数据库的使用类型与公司类型", checked: true },
        { id: "scores", title: "风险评分", desc: "IPPure、IP2Location 等原始评分", checked: true },
        { id: "factors", title: "风险因素", desc: "代理、VPN、Tor、机房等标记", checked: false },
        { id: "egress", title: "出口分流", desc: "按探针来源核对不同出口 IP", checked: false },
        { id: "bgp", title: "BGP 信息", desc: "前缀、Origin ASN、RPKI 与 PTR", checked: false },
        { id: "bgppath", title: "BGP 路径", desc: "RIPE RIS 控制面路径与可见性", checked: false },
        { id: "speed", title: "三网真实测速", desc: "电信、联通、移动下载与上传", checked: false },
        { id: "inbound", title: "外部探针入站路径", desc: "Globalping 中国探针 traceroute", checked: false },
        { id: "ping", title: "外部探针 Ping", desc: "延迟、丢包与抖动", checked: false },
        { id: "mtr", title: "外部探针 MTR", desc: "入站逐跳统计", checked: false },
        { id: "stability", title: "HTTPS 稳定性", desc: "成功率、中位数、P95 与波动", checked: false },
        { id: "media", title: "流媒体与 AI", desc: "TikTok、Netflix、ChatGPT 等", checked: true },
        { id: "regions", title: "地区一致性", desc: "出口地区与平台返回地区对比", checked: false },
        { id: "status", title: "数据状态", desc: "成功来源、失败来源与出口一致性", checked: false }
      ];
      var params = new URLSearchParams(location.search);
      var runId = params.get("run") || "";
      var options = document.getElementById("module-options");
      var results = document.getElementById("results");
      var selectedCount = document.getElementById("selected-count");
      var progress = document.getElementById("progress");
      var sessionLabel = document.getElementById("session-label");
      var runButton = document.getElementById("run-button");
      var clearButton = document.getElementById("clear-button");
      var running = false;

      restoreSelection();
      renderOptions();
      sessionLabel.textContent = runId ? "会话 " + runId : "缺少会话，请返回 Loon 重新启动";
      runButton.disabled = !runId;

      runButton.addEventListener("click", runSelected);
      clearButton.addEventListener("click", clearResults);

      function renderOptions() {
        options.innerHTML = "";
        MODULES.forEach(function (item) {
          var row = document.createElement("label");
          row.className = "option";
          row.innerHTML = '<span class="option-copy"><span class="option-name">' + escapeHtml(item.title) + '</span><span class="option-desc">' + escapeHtml(item.desc) + '</span></span><span class="switch"><input type="checkbox" data-module="' + item.id + '"' + (item.checked ? " checked" : "") + '><span class="track"></span></span>';
          row.querySelector("input").addEventListener("change", function (event) {
            item.checked = event.target.checked;
            persistSelection();
            updateSelectedCount();
          });
          options.appendChild(row);
        });
        updateSelectedCount();
      }

      function updateSelectedCount() {
        var count = MODULES.filter(function (item) { return item.checked; }).length;
        selectedCount.textContent = count + " 项已开启";
      }

      async function runSelected() {
        if (running || !runId) return;
        var selected = MODULES.filter(function (item) { return item.checked; });
        if (!selected.length) {
          progress.textContent = "请至少开启一个检测项目";
          return;
        }
        running = true;
        setControlsDisabled(true);
        results.innerHTML = "";
        selected.forEach(createResult);
        var completed = 0;
        var cursor = 0;
        progress.textContent = "0/" + selected.length + " 已完成 · 最多两个模块并发";

        async function worker() {
          while (cursor < selected.length) {
            var item = selected[cursor++];
            await runModule(item);
            completed += 1;
            progress.textContent = completed + "/" + selected.length + " 已完成";
          }
        }

        try {
          await Promise.all([worker(), worker()]);
          progress.textContent = selected.length + " 项检测完成";
        } finally {
          running = false;
          setControlsDisabled(false);
          runButton.textContent = "重新检测已选项目";
        }
      }

      function createResult(item) {
        var detail = document.createElement("details");
        detail.className = "result";
        detail.dataset.module = item.id;
        detail.dataset.state = "running";
        detail.innerHTML = '<summary><span class="result-title"><span class="dot"></span>' + escapeHtml(item.title) + '</span><span class="result-status">等待执行</span></summary><div class="result-content"><p class="muted">模块进入队列后将自动开始。</p></div>';
        results.appendChild(detail);
      }

      async function runModule(item) {
        var detail = results.querySelector('[data-module="' + item.id + '"]');
        var status = detail.querySelector(".result-status");
        var content = detail.querySelector(".result-content");
        detail.dataset.state = "running";
        status.textContent = "检测中…";
        content.innerHTML = '<p class="muted">正在通过目标节点请求真实检测来源…</p>';
        try {
          var response = await fetch("/ipquality/api/" + item.id + "?run=" + encodeURIComponent(runId), {
            method: "GET",
            cache: "no-store",
            headers: { "Accept": "application/json" }
          });
          var data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "HTTP " + response.status);
          detail.dataset.state = "success";
          status.textContent = formatDuration(data.elapsedMs);
          content.innerHTML = "";
          var frame = document.createElement("iframe");
          frame.className = "report-frame";
          frame.title = item.title + "检测结果";
          frame.setAttribute("sandbox", "allow-same-origin allow-popups allow-popups-to-escape-sandbox");
          frame.srcdoc = data.html;
          frame.addEventListener("load", function () { resizeFrame(frame); });
          content.appendChild(frame);
          detail.open = true;
        } catch (error) {
          detail.dataset.state = "error";
          status.textContent = "失败";
          content.innerHTML = '<p class="error">' + escapeHtml(error && error.message || "未知错误") + '</p>';
          detail.open = true;
        }
      }

      function resizeFrame(frame) {
        var attempts = 0;
        function update() {
          try {
            var doc = frame.contentDocument;
            var height = Math.max(doc.body ? doc.body.scrollHeight : 0, doc.documentElement ? doc.documentElement.scrollHeight : 0);
            if (height > 0) frame.style.height = (height + 12) + "px";
          } catch (_) {}
          attempts += 1;
          if (attempts < 6) setTimeout(update, 250);
        }
        update();
      }

      function setControlsDisabled(value) {
        runButton.disabled = value || !runId;
        clearButton.disabled = value;
        Array.prototype.forEach.call(options.querySelectorAll("input"), function (input) { input.disabled = value; });
        runButton.textContent = value ? "正在检测…" : "开始检测已选项目";
      }

      function clearResults() {
        if (running) return;
        results.innerHTML = '<div class="panel empty">选择项目后开始检测</div>';
        progress.textContent = "结果已清空";
      }

      function persistSelection() {
        try {
          localStorage.setItem("paperclip.ipquality.web.modules", JSON.stringify(MODULES.filter(function (item) { return item.checked; }).map(function (item) { return item.id; })));
        } catch (_) {}
      }

      function restoreSelection() {
        try {
          var saved = JSON.parse(localStorage.getItem("paperclip.ipquality.web.modules") || "null");
          if (!Array.isArray(saved)) return;
          MODULES.forEach(function (item) { item.checked = saved.indexOf(item.id) >= 0; });
        } catch (_) {}
      }

      function formatDuration(ms) {
        var value = Number(ms);
        if (!Number.isFinite(value)) return "完成";
        return value >= 1000 ? (value / 1000).toFixed(value >= 10000 ? 1 : 2) + " 秒" : Math.round(value) + " ms";
      }

      function escapeHtml(value) {
        return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
    })();
  </script>
</body>
</html>
